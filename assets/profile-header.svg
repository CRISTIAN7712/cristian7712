<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="558" viewBox="0 0 1200 558" fill="none" role="img" aria-labelledby="title">
<title id="title">Cristian David Díaz Tovar. Ideas que se convierten en código. Código que se comparte. Desarrollador de software y docente de programación en Pasto, Colombia.</title>
